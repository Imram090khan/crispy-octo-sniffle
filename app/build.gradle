plugins {
    id "com.android.application"
}

android {
    namespace "com.speedshield.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.speedshield.app"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }

    // A fixed test key, so new builds install over old ones. Keep the repository private.
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
